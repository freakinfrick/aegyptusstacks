model:
  # Any OpenAI-compatible endpoint — ollama, llama-server, vllm, etc.
  # Override with LLM_API_BASE and LLM_MODEL environment variables.
  # Reference setup: Gemma 4 31B (dense) on llama-server, the model the Librarian
  # eval picked. The system prompt plus skill schemas run ~14k tokens on their own,
  # so context_length must leave room for the conversation on top; 8k truncates
  # the prompt before the first turn.
  name: gemma4-31b-dense
  api_base: http://localhost:8080/v1
  context_length: 65536

system_prompt: system_prompt.md

skills:
  - bfs-search
  - bfs-navigate
  - bfs-gather
  - bfs-read
  - bfs-article
  - bfs-annotate
  - bfs-describe
  - bfs-pathfind

settings:
  max_turns: 50
  temperature: 0.7
  max_tokens: 512
