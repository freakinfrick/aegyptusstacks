<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="'JetBrains Mono','Fira Code','Cascadia Code','Consolas',monospace">
  <defs>
    <marker id="arr-gold" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto">
      <path d="M0,0.5 L9,3 L0,5.5" fill="none" stroke="#dcb428" stroke-width="1"/>
    </marker>
    <radialGradient id="vig" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e0c09"/>
      <stop offset="70%" stop-color="#0c0a08"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <filter id="lg" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="url(#vig)"/>

  <!-- Particles -->
  <g opacity="0.11">
    <circle cx="100" cy="300" r="1" fill="#dcb428"/><circle cx="1300" cy="400" r="0.7" fill="#50dcc8"/>
    <circle cx="700" cy="100" r="0.8" fill="#f0ebe0"/><circle cx="200" cy="600" r="0.6" fill="#c050b8"/>
    <circle cx="1100" cy="200" r="0.7" fill="#00c853"/><circle cx="400" cy="700" r="0.8" fill="#377d73"/>
  </g>

  <!-- Era strip -->
  <g>
    <rect x="0" y="0" width="5" height="103" fill="#8c7346" opacity="0.7"/>
    <rect x="0" y="103" width="5" height="102" fill="#a08250" opacity="0.7"/>
    <rect x="0" y="205" width="5" height="103" fill="#645a4b" opacity="0.7"/>
    <rect x="0" y="308" width="5" height="102" fill="#967846" opacity="0.7"/>
    <rect x="0" y="410" width="5" height="103" fill="#5a5046" opacity="0.7"/>
    <rect x="0" y="513" width="5" height="102" fill="#554696" opacity="0.7"/>
    <rect x="0" y="615" width="5" height="103" fill="#4b7355" opacity="0.7"/>
    <rect x="0" y="718" width="5" height="102" fill="#377d73" opacity="0.7"/>
  </g>

  <!-- ═══ TITLE ═══ -->
  <text x="700" y="32" text-anchor="middle" font-size="20" fill="#f0ebe0" letter-spacing="5" font-weight="bold">THE SUBSTRATE PARADIGM</text>
  <text x="700" y="54" text-anchor="middle" font-size="12" fill="#8a7a58" letter-spacing="3">AGENTS AS INHABITANTS, NOT ASSISTANTS</text>
  <line x1="460" y1="62" x2="940" y2="62" stroke="#dcb428" stroke-width="0.4" opacity="0.3"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--        LEFT PANEL: PLAYER                               -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <text x="300" y="95" text-anchor="middle" font-size="28" fill="#00c853" font-weight="bold">@@</text>
  <text x="300" y="115" text-anchor="middle" font-size="15" fill="#00c853" letter-spacing="2" font-weight="bold">PLAYER</text>
  <text x="300" y="135" text-anchor="middle" font-size="12" fill="#8a7a58">Human · Keystrokes · Terminal</text>

  <!-- Panel with green tint -->
  <rect x="70" y="150" width="460" height="260" rx="4" fill="#0a0908" stroke="#00c853" stroke-width="1" opacity="0.9"/>
  <rect x="70" y="150" width="460" height="20" rx="4" fill="#0d1a0d"/>
  <rect x="70" y="150" width="3" height="260" fill="#00c853" opacity="0.3"/>
  <text x="84" y="164" font-size="11" fill="#00c853" opacity="0.5">terminal — stacks-engine</text>

  <!-- Step 1: Navigate -->
  <text x="90" y="192" font-size="11" fill="#6b5c3a">NAVIGATE</text>
  <text x="90" y="210" font-size="13" fill="#00c853">$ press [E]</text>
  <text x="90" y="228" font-size="12" fill="#f0ebe0">→ navigate("E") → enters ns-tongue</text>

  <!-- Separator -->
  <line x1="90" y1="238" x2="510" y2="238" stroke="#1e1c18" stroke-width="0.5"/>

  <!-- Step 2: Read -->
  <text x="90" y="258" font-size="11" fill="#6b5c3a">READ</text>
  <text x="90" y="276" font-size="13" fill="#00c853">$ press [Space] on shelf</text>
  <text x="90" y="294" font-size="12" fill="#f0ebe0">→ shelf_0: aeg_oraec_38, aeg_tla_hf_12</text>

  <!-- Separator -->
  <line x1="90" y1="304" x2="510" y2="304" stroke="#1e1c18" stroke-width="0.5"/>

  <!-- Step 3: Gather -->
  <text x="90" y="324" font-size="11" fill="#6b5c3a">GATHER</text>
  <text x="90" y="342" font-size="13" fill="#00c853">$ press [G]</text>
  <text x="90" y="360" font-size="12" fill="#f0ebe0">→ gather(aeg_oraec_38) → inventory +1</text>

  <!-- State summary -->
  <text x="90" y="392" font-size="11" fill="#6b5c3a">Room: [6,-2,0] ns-tongue · Inventory: [aeg_oraec_38]</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--        RIGHT PANEL: LIBRARIAN                           -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <text x="1100" y="95" text-anchor="middle" font-size="28" fill="#c050b8" font-weight="bold">&amp;&amp;</text>
  <text x="1100" y="115" text-anchor="middle" font-size="15" fill="#c050b8" letter-spacing="2" font-weight="bold">LIBRARIAN</text>
  <text x="1100" y="135" text-anchor="middle" font-size="12" fill="#8a7a58">Hermes Agent · FIFO · JSON</text>

  <!-- Panel with magenta tint -->
  <rect x="870" y="150" width="460" height="260" rx="4" fill="#0a0908" stroke="#c050b8" stroke-width="1" opacity="0.9"/>
  <rect x="870" y="150" width="460" height="20" rx="4" fill="#1a0d18"/>
  <rect x="870" y="150" width="3" height="260" fill="#c050b8" opacity="0.3"/>
  <text x="884" y="164" font-size="11" fill="#c050b8" opacity="0.5">hermes — stacks-librarian</text>

  <!-- Step 1: Navigate -->
  <text x="890" y="192" font-size="11" fill="#6b5c3a">NAVIGATE</text>
  <text x="890" y="210" font-size="13" fill="#c050b8">⟐ {"navigate": "E"}</text>
  <text x="890" y="228" font-size="12" fill="#f0ebe0">→ navigate("E") → enters ns-tongue</text>

  <line x1="890" y1="238" x2="1310" y2="238" stroke="#1e1c18" stroke-width="0.5"/>

  <!-- Step 2: Read -->
  <text x="890" y="258" font-size="11" fill="#6b5c3a">READ</text>
  <text x="890" y="276" font-size="13" fill="#c050b8">⟐ room-texts 5,-2,0</text>
  <text x="890" y="294" font-size="12" fill="#f0ebe0">→ shelf_0: aeg_oraec_38, aeg_tla_hf_12</text>

  <line x1="890" y1="304" x2="1310" y2="304" stroke="#1e1c18" stroke-width="0.5"/>

  <!-- Step 3: Gather -->
  <text x="890" y="324" font-size="11" fill="#6b5c3a">GATHER</text>
  <text x="890" y="342" font-size="13" fill="#c050b8">⟐ {"gather": "aeg_oraec_38"}</text>
  <text x="890" y="360" font-size="12" fill="#f0ebe0">→ gather(aeg_oraec_38) → inventory +1</text>

  <!-- State summary (identical) -->
  <text x="890" y="392" font-size="11" fill="#6b5c3a">Room: [6,-2,0] ns-tongue · Inventory: [aeg_oraec_38]</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--        CENTER: THE KEY INSIGHT                          -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Big equals sign -->
  <text x="700" y="250" text-anchor="middle" font-size="48" fill="#dcb428" opacity="0.25" font-weight="bold">=</text>

  <!-- Matching result highlights — warm white lines are IDENTICAL -->
  <text x="700" y="196" text-anchor="middle" font-size="11" fill="#dcb428" opacity="0.5">different input</text>
  <text x="700" y="300" text-anchor="middle" font-size="13" fill="#dcb428" font-weight="bold">same result</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--         CONVERGENCE BAND                                -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Arrows converging -->
  <g filter="url(#lg)">
    <line x1="300" y1="410" x2="520" y2="450" stroke="#dcb428" stroke-width="1.5" marker-end="url(#arr-gold)"/>
  </g>
  <g filter="url(#lg)">
    <line x1="1100" y1="410" x2="880" y2="450" stroke="#dcb428" stroke-width="1.5" marker-end="url(#arr-gold)"/>
  </g>

  <!-- The band itself — heavier, more present -->
  <line x1="70" y1="453" x2="1330" y2="453" stroke="#dcb428" stroke-width="1" opacity="0.4"/>
  <rect x="70" y="454" width="1260" height="85" rx="0" fill="#121010"/>
  <rect x="70" y="454" width="1260" height="85" rx="0" fill="#dcb428" opacity="0.02"/>
  <line x1="70" y1="539" x2="1330" y2="539" stroke="#dcb428" stroke-width="1" opacity="0.4"/>
  <rect x="70" y="454" width="5" height="85" fill="#dcb428" opacity="0.5"/>
  <rect x="1325" y="454" width="5" height="85" fill="#dcb428" opacity="0.5"/>

  <text x="700" y="480" text-anchor="middle" font-size="18" fill="#dcb428" letter-spacing="3" font-weight="bold">IDENTICAL STATE MUTATION</text>
  <text x="700" y="506" text-anchor="middle" font-size="13" fill="#a08c60">Same JSON commands · Same BFS responses · Same canonical IDs · Same room contents</text>
  <text x="700" y="530" text-anchor="middle" font-size="12" fill="#8a7a58">No game API · No agent SDK · No adapter layer · The boundary dissolves at the protocol level</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--              THREE CONSEQUENCES                         -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- 1. Terminal IS State (primary) -->
  <text x="160" y="580" font-size="15" fill="#f0ebe0" letter-spacing="2" font-weight="bold">TERMINAL IS STATE</text>
  <text x="160" y="604" font-size="12" fill="#a08c60">tmux capture-pane = agent context</text>
  <text x="160" y="624" font-size="12" fill="#a08c60">The rendered text IS the data</text>
  <text x="160" y="650" font-size="11" fill="#8a7a58">No CV. No screen parsing.</text>
  <text x="160" y="668" font-size="11" fill="#8a7a58">Agents can PLAY the game</text>
  <text x="160" y="686" font-size="11" fill="#8a7a58">through the terminal directly.</text>

  <!-- 2. Agents Without Game (secondary) -->
  <text x="570" y="580" font-size="14" fill="#a08c60" letter-spacing="2" font-weight="bold">AGENTS WITHOUT GAME</text>
  <text x="570" y="604" font-size="12" fill="#a08c60">Librarian traverses BFS from CLI</text>
  <text x="570" y="624" font-size="12" fill="#a08c60">stacks-librarian.sh room-texts 5,-2,-3</text>
  <text x="570" y="650" font-size="11" fill="#8a7a58">Same tools. Same data.</text>
  <text x="570" y="668" font-size="11" fill="#8a7a58">The game is one expression surface</text>
  <text x="570" y="686" font-size="11" fill="#8a7a58">for something the agent already does.</text>

  <!-- 3. Scribe Inherits (tertiary, cyan) -->
  <text x="990" y="580" font-size="14" fill="#00d2d2" letter-spacing="2" font-weight="bold">%% SCRIBE INHERITS</text>
  <text x="990" y="604" font-size="12" fill="#a08c60">Reads same canonical IDs</text>
  <text x="990" y="624" font-size="12" fill="#a08c60">the shelf menu displays</text>
  <text x="990" y="650" font-size="11" fill="#8a7a58">get_volume(aeg_oraec_38)</text>
  <text x="990" y="668" font-size="11" fill="#8a7a58">Same text. Same provenance.</text>
  <text x="990" y="686" font-size="11" fill="#8a7a58">Articles cite real passages.</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--              PARADIGM STATEMENT                         -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <line x1="200" y1="712" x2="1200" y2="712" stroke="#dcb428" stroke-width="0.6" opacity="0.2"/>

  <text x="700" y="742" text-anchor="middle" font-size="14" fill="#dcb428" font-style="italic" opacity="0.7">The agent reads what the player reads. Writes what the player writes.</text>
  <text x="700" y="764" text-anchor="middle" font-size="14" fill="#dcb428" font-style="italic" opacity="0.7">Traverses what the player traverses. With or without the game running.</text>

  <!-- Footer -->
  <line x1="100" y1="786" x2="1300" y2="786" stroke="#1e1c18" stroke-width="0.4" opacity="0.3"/>
  <text x="700" y="806" text-anchor="middle" font-size="11" fill="#4a4030" letter-spacing="1">When data, space, and interface share a CLI substrate, LLM agents become inhabitants — not assistants called upon it.</text>
</svg>
